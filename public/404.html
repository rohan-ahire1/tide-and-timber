<style>
  :root {
    --desk: #9cc2df;
    --navy: #14294a;
    --ink: #1d3558;
    --ink-soft: #4a5d7a;
    --orange: #ee6a22;
    --orange-deep: #c54e14;
    --paper: #f8f3ea;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --hand: 'Caveat', 'Bradley Hand', cursive;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: var(--desk);
    color: var(--navy);
    font-family: var(--sans);
  }
  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
    background: var(--paper);
    border-radius: 4px;
    padding: 56px 40px;
    box-shadow: -2px 4px 5px rgba(18, 38, 60, .1), -10px 20px 30px rgba(18, 38, 60, .14);
  }
  .wordmark {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.03em;
    color: var(--navy);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 28px;
  }
  .wordmark .dot { color: var(--orange); }
  h1 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(30px, 4.6vw, 44px);
    line-height: 1.08;
    letter-spacing: -0.03em;
    margin: 0 0 16px;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 28px;
    max-width: 38ch;
    margin-inline: auto;
  }
  .note {
    display: block;
    font-family: var(--hand);
    font-size: 22px;
    color: var(--orange-deep);
    margin: -6px 0 22px;
    transform: rotate(-2deg);
  }
  a.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 999px;
    background: var(--orange);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 5px 0 var(--orange-deep);
    transition: transform 0.2s;
  }
  a.back:hover {
    transform: translateY(-2px);
  }
  .credit {
    margin: 28px auto 0;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="wordmark">Tide &amp; Timber<span class="dot">.</span></span>
    <h1>This page drifted out with the tide.</h1>
    <span class="note">not on the desk, not in the drawer either</span>
    <p>Whatever you were looking for isn't here. Head back to the workbench and start again.</p>
    <a class="back" href="/">Back to the desk</a>
    <p class="credit">A concept by Rohan Ahire</p>
  </div>
